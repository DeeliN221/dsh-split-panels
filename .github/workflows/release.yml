name: Release

# Tag-only release. Pushing an annotated tag v<major>.<minor>.<patch> is the
# only trigger: there is no schedule, no date-counter version and no
# "version bump commit" written back to main. package.json is the single
# version source; the tag must already match it, otherwise the run fails
# before anything is published.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve tag version and verify package.json
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag '$tag' is not v<major>.<minor>.<patch>; this repo only releases plain SemVer tags."
            exit 1
          fi
          tag_version="${tag#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag '$tag' does not match package.json version '$pkg_version'. Run 'pnpm version:set $tag_version', commit package.json + src/client.ts + rebuilt lib/, merge to main, then tag that merge commit."
            exit 1
          fi
          echo "tag $tag matches package.json $pkg_version"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Verify and package
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm version:check
          pnpm typecheck
          pnpm build
          # lib/ ships inside the tarball; the committed build must match src/.
          git diff --exit-code -- lib/
          mkdir -p release
          pnpm pack --pack-destination release
          cd release
          sha256sum ./*.tgz > SHA256SUMS
          sha256sum --check SHA256SUMS
          ls -l

      - name: Publish GitHub Release (no npm publish)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --verify-tag --draft --title "$TAG" --generate-notes \
            release/*.tgz release/SHA256SUMS
          install_note="安装：下载 dsh-split-panels-$VERSION.tgz 与 SHA256SUMS，先 sha256sum --check SHA256SUMS，再执行 dsh plugin --profile web add ./dsh-split-panels-$VERSION.tgz。Built from tag $TAG on commit $GITHUB_SHA；本工作流只创建 GitHub Release，不发布到 npm。"
          generated="$(gh release view "$TAG" --json body --jq .body)"
          notes="$(printf '%s\n\n%s\n' "$install_note" "$generated")"
          gh release edit "$TAG" --notes "$notes" --draft=false --prerelease=false --latest
          gh release view "$TAG" --json tagName,isDraft,isPrerelease,assets --jq '{tag:.tagName,draft:.isDraft,prerelease:.isPrerelease,assets:[.assets[].name]}' | tee -a "$GITHUB_STEP_SUMMARY"
